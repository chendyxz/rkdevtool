name: build

on:
  push:
    branches:
      - main
      - dev
    tags:
      - v*

# macOS Secrets:
#   签名: APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD / KEYCHAIN_PASSWORD
#   APPLE_CERTIFICATE 必须是 Developer ID Application 的 .p12（不是 Apple Development）
#   创建: developer.apple.com → Certificates → Developer ID Application
#   公证(仅 tag 发布): APPLE_ID / APPLE_PASSWORD(应用专用密码) / APPLE_TEAM_ID
#   APPLE_PASSWORD 必须在 https://appleid.apple.com 生成「应用专用密码」(xxxx-xxxx-xxxx-xxxx)
#   不能用 Apple ID 登录密码；需在 Developer 网站接受最新协议
# 见 https://v2.tauri.app/distribute/sign/macos/
#
# Updater Secrets (GitHub Release 自动更新):
#   TAURI_SIGNING_PRIVATE_KEY          — tauri signer 生成的私钥内容（勿提交仓库）
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD — 私钥密码（无密码可留空或不设）
#   公钥写在 src-tauri/tauri.conf.json → plugins.updater.pubkey
#   更新清单: https://github.com/hiifong/rkdevtool/releases/latest/download/latest.json
# 见 https://v2.tauri.app/plugin/updater/
#
# 触发规则:
#   push main  → 构建 Apple Silicon 测试包并上传 Artifacts
#   push v* tag → 构建 Apple Silicon 测试包并发布 GitHub Release

jobs:
  publish-tauri:
    permissions:
      contents: write
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: latest

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Ad-hoc sign bundled macOS tools
        run: |
          TOOL="src-tauri/bin/mac/upgrade_tool"
          if [ -f "$TOOL" ]; then
            codesign --force --sign - "$TOOL"
            codesign --verify --verbose "$TOOL"
          fi
          for TOOL in src-tauri/resources/firmware-tools/macos-arm64/*; do
            codesign --force --sign - "$TOOL"
            codesign --verify --verbose "$TOOL"
          done
          tar -czf src-tauri/resources/firmware-tools/macos-arm64.tar.gz \
            -C src-tauri/resources/firmware-tools/macos-arm64 .

      - name: Install frontend dependencies
        run: npm ci

      # 未配置 Apple Developer 证书：生成 Apple Silicon 测试包，不签名、不公证。
      - name: Build (push to main)
        if: github.ref == 'refs/heads/main'
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target aarch64-apple-darwin --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Upload workflow artifacts
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: rkdevtool-macos-arm64
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/
          if-no-files-found: error

      # 推送 tag：发布未签名、未公证的 Apple Silicon 测试版。
      - name: Build and release (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: RKDevTool v__VERSION__
          releaseBody: See the assets to download this version and install.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: false
          args: --target aarch64-apple-darwin --config '{"bundle":{"createUpdaterArtifacts":false}}'
