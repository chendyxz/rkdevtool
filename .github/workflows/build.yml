name: build

on:
  push:
    branches:
      - main
      - dev
    tags:
      - v*

# macOS Secrets:
#   签名: APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD / KEYCHAIN_PASSWORD
#   APPLE_CERTIFICATE 必须是 Developer ID Application 的 .p12（不是 Apple Development）
#   创建: developer.apple.com → Certificates → Developer ID Application
#   公证(仅 tag 发布): APPLE_ID / APPLE_PASSWORD(应用专用密码) / APPLE_TEAM_ID
#   APPLE_PASSWORD 必须在 https://appleid.apple.com 生成「应用专用密码」(xxxx-xxxx-xxxx-xxxx)
#   不能用 Apple ID 登录密码；需在 Developer 网站接受最新协议
# 见 https://v2.tauri.app/distribute/sign/macos/
#
# Updater Secrets (GitHub Release 自动更新):
#   TAURI_SIGNING_PRIVATE_KEY          — tauri signer 生成的私钥内容（勿提交仓库）
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD — 私钥密码（无密码可留空或不设）
#   公钥写在 src-tauri/tauri.conf.json → plugins.updater.pubkey
#   更新清单: https://github.com/chendyxz/rkdevtool/releases/latest/download/latest.json
# 见 https://v2.tauri.app/plugin/updater/
#
# 触发规则:
#   push main  → 构建 macOS / Windows 测试包并上传 Artifacts
#   push v* tag → 构建 macOS / Windows 测试包并发布到同一个 GitHub Release
#
# Release 正文取自 docs/releases/v<版本>.md（缺失时回退为占位文案）。
# tauri-action 会同时把该正文写进 latest.json 的 notes，应用内更新提示读的就是它，
# 因此发布前务必先提交对应版本的 docs/releases/vX.Y.Z.md。
#
# 两个平台都会向 Release 的 latest.json 合并自己的条目，因此共用同一个
# concurrency group 串行发布，避免并发写覆盖对方的平台条目。

jobs:
  publish-tauri:
    permissions:
      contents: write
    runs-on: macos-latest
    concurrency:
      group: tauri-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: latest

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Ad-hoc sign bundled macOS tools
        run: |
          TOOL="src-tauri/bin/mac/upgrade_tool"
          if [ -f "$TOOL" ]; then
            codesign --force --sign - "$TOOL"
            codesign --verify --verbose "$TOOL"
          fi
          TOOL="src-tauri/resources/platform-tools/macos-arm64/adb"
          codesign --force --sign - "$TOOL"
          codesign --verify --verbose "$TOOL"
          for TOOL in src-tauri/resources/firmware-tools/macos-arm64/*; do
            codesign --force --sign - "$TOOL"
            codesign --verify --verbose "$TOOL"
          done
          tar -czf src-tauri/resources/firmware-tools/macos-arm64.tar.gz \
            -C src-tauri/resources/firmware-tools/macos-arm64 .

      - name: Install frontend dependencies
        run: npm ci

      # 未配置 Apple Developer 证书：生成 Apple Silicon 测试包，不签名、不公证。
      - name: Build (push to main)
        if: github.ref == 'refs/heads/main'
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: "-"
        with:
          args: --target aarch64-apple-darwin --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Upload workflow artifacts
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: rkdevtool-macos-arm64
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/
          if-no-files-found: error

      # 读取 docs/releases/v<版本>.md 作为 Release 正文（多行 output）。
      - name: Load release notes
        if: startsWith(github.ref, 'refs/tags/v')
        id: release_notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes_file="docs/releases/v${version}.md"
          if [ -f "$notes_file" ]; then
            {
              echo "body<<__RELEASE_NOTES_EOF__"
              cat "$notes_file"
              echo "__RELEASE_NOTES_EOF__"
            } >> "$GITHUB_OUTPUT"
          else
            echo "::warning::$notes_file not found, falling back to the default release body."
            echo "body=See the assets to download this version and install." >> "$GITHUB_OUTPUT"
          fi

      # 推送 tag：发布未公证的 Apple Silicon 测试版，并生成自动更新清单与签名。
      - name: Build and release (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: "-"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: RKDevTool v__VERSION__
          releaseBody: ${{ steps.release_notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: --target aarch64-apple-darwin

  publish-tauri-windows:
    permissions:
      contents: write
    runs-on: windows-latest
    concurrency:
      group: tauri-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: latest

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # ADB 二进制不入库，构建前从 Google 官方 platform-tools 拉取
      - name: Fetch bundled ADB (platform-tools)
        shell: bash
        run: packaging/windows/fetch-platform-tools.sh

      - name: Install frontend dependencies
        run: npm ci

      # 未配置代码签名证书：生成未签名的 NSIS 安装包。
      - name: Build (push to main)
        if: github.ref == 'refs/heads/main'
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target x86_64-pc-windows-msvc --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Upload workflow artifacts
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: rkdevtool-windows-x86_64
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/
          if-no-files-found: error

      # 读取 docs/releases/v<版本>.md 作为 Release 正文（多行 output）。
      - name: Load release notes
        if: startsWith(github.ref, 'refs/tags/v')
        id: release_notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes_file="docs/releases/v${version}.md"
          if [ -f "$notes_file" ]; then
            {
              echo "body<<__RELEASE_NOTES_EOF__"
              cat "$notes_file"
              echo "__RELEASE_NOTES_EOF__"
            } >> "$GITHUB_OUTPUT"
          else
            echo "::warning::$notes_file not found, falling back to the default release body."
            echo "body=See the assets to download this version and install." >> "$GITHUB_OUTPUT"
          fi

      # 推送 tag：发布未签名的 NSIS 安装包，并把自己的平台条目合并进 latest.json。
      - name: Build and release (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: RKDevTool v__VERSION__
          releaseBody: ${{ steps.release_notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: --target x86_64-pc-windows-msvc
